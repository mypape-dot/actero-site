name: ActeRO security and guide routing checks
on:
  push:
    branches:
      - "fix/**"
      - "audit/**"
      - "feature/**"
  pull_request:
    branches:
      - "feature/**"
      - main

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reject public premium guide sources and QA copies
        run: node scripts/check-public-surface.mjs
      - name: Verify all 43 guide-key routing contracts
        run: node --test cloudflare/tests/guide-catalog.test.mjs
      - name: Verify paid guide authorization and header tokens
        run: node --test cloudflare/tests/protected-guide-access.test.mjs
      - name: Verify checkout disabled by default in public previews
        run: node --test cloudflare/tests/public-runtime-config.test.mjs
      - name: Verify questionnaire status history and travel routing
        run: node --test cloudflare/tests/quiz-history.test.mjs
      - name: Verify engine routing and unresolved-case regressions
        run: node --test cloudflare/tests/engine-logic-regression.test.mjs
      - name: Verify complete questionnaire journeys across 43 guide keys
        run: node --test cloudflare/tests/engine-full-journeys.test.mjs
      - name: Verify payment policy, contradictions and the 29 audit cases of 15 Oct 2026
        run: node --test cloudflare/tests/engine-rules.test.mjs cloudflare/tests/engine-audit-2026-10-15.test.mjs cloudflare/tests/engine-t01-t02.test.mjs
      - name: Verify guide review register and block incomplete approvals
        run: node --test cloudflare/tests/guide-review-register.test.mjs
      - name: Verify FR/BE/NL/IE official-evidence checklist across 12 guide variants
        run: node --test cloudflare/tests/four-country-b1-b5-editorial.test.mjs
      - name: Verify Belgian Dutch Irish evidence semantics across 9 guide routes
        run: node --test cloudflare/tests/be-nl-ie-evidence-gates.test.mjs
      - name: Guard default official document URLs and conditional form applicability
        run: node --test cloudflare/tests/official-doc-applicability.test.mjs
      - name: Validate private-read-only guide auditing tools using synthetic fixtures
        run: |
          node --check cloudflare/private-12-guide-preflight-local.mjs
          bash -n cloudflare/audit-private-12-on-mac.sh
          node --test cloudflare/tests/private-12-guide-preflight.test.mjs
      - name: Verify private visual renderer entrypoint logic with synthetic source
        run: |
          node --check cloudflare/private-12-guide-render-local.mjs
          node --check cloudflare/private-12-render-selector.mjs
          bash -n cloudflare/audit-private-12-visual-on-mac.sh
          node --test cloudflare/tests/private-12-render-selector.test.mjs
      - name: Verify private procedural evidence signal detection is conservative and nondisclosing
        run: |
          node --check cloudflare/procedure-signal-classifier.mjs
          node --check cloudflare/private-12-guide-render-local.mjs
          bash -n cloudflare/audit-private-12-procedure-signals-on-mac.sh
          node --test cloudflare/tests/private-guide-procedure-signals.test.mjs
      - name: Verify read-only editorial inventory
        run: |
          node --check cloudflare/inventory-private-12-claims-local.mjs
          bash -n cloudflare/audit-private-12-claims-on-mac.sh
          node --test cloudflare/tests/inventory-private-12-claims.test.mjs
      - name: Verify confidential exact editorial badge draft with synthetic-only fixtures
        run: |
          node --check cloudflare/prepare-private-12-badge-draft.mjs
          bash -n cloudflare/audit-private-12-badge-on-mac.sh
          node --test cloudflare/tests/private-12-badge-draft.test.mjs
      - name: Verify shared-country review registry contains 40 explicit signoffs
        run: node --test cloudflare/tests/guide-country-review-register.test.mjs
      - name: Verify server checkout requires exact guide and all-country approval
        run: node --test cloudflare/tests/guide-approval.test.mjs
      - name: Verify offline D1 inventory checker rejects unsafe exports
        run: node --test cloudflare/tests/audit-d1-metadata.test.mjs
      - name: Check B5 editorial preflight with synthetic-only fixtures
        run: |
          node --check cloudflare/b5-editorial-preflight-local.mjs
          node --test cloudflare/tests/b5-editorial-preflight.test.mjs
      - name: Check eight-country B5 evidence matrix with synthetic fixtures
        run: |
          node --check cloudflare/b5-country-evidence-local.mjs
          node --test cloudflare/tests/b5-country-evidence.test.mjs
      - name: Verify four-country B5 editorial draft generator with synthetic fixtures
        run: |
          node --check cloudflare/prepare-b5-country-review-local.mjs
          node --test cloudflare/tests/b5-country-revision.test.mjs
      - name: Validate local B5 review utilities syntax
        run: |
          node --check cloudflare/prepare-b5-uk-review.mjs
          node --check cloudflare/verify-b5-review-diff.mjs
          node --check cloudflare/prepare-b5-checklist-review.mjs
          node --check cloudflare/verify-b5-checklist-diff.mjs
      - name: Backend and client regression tests
        run: >
          node --test
          cloudflare/tests/evaluation-session.test.mjs
          cloudflare/tests/checkout-frontend.test.mjs
          cloudflare/tests/quota.test.mjs
          cloudflare/tests/recovery.test.mjs
          cloudflare/tests/recovery-page.test.mjs
          cloudflare/tests/swiss-loop.test.mjs
      - name: Shopify payment and reversal regression harness
        run: node --no-warnings cloudflare/tests/audit-payment.test.mjs

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Historical B5 renderer test reads public main locally, no paid D1 script is exported
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Playwright test browsers
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify private visual QA on 12 synthetic guides (24 offline renders)
        run: |
          output="$RUNNER_TEMP/actero-12-visual-synthetic"
          node cloudflare/tests/private-12-visual-synthetic-fixture.mjs | node cloudflare/private-12-guide-render-local.mjs "$output"
          test -f "$output/diagnostic-summary.json"
      - name: Test private UNDEPLOYED neutral-badge draft with 24 synthetic renders
        run: |
          draft="$RUNNER_TEMP/actero-12-badge-draft"
          output="$RUNNER_TEMP/actero-12-badge-render"
          node cloudflare/tests/private-12-visual-synthetic-fixture.mjs --editorial-badge |
            node cloudflare/prepare-private-12-badge-draft.mjs "$draft"
          node cloudflare/private-12-guide-render-local.mjs "$output" < "$draft/private-draft.json"
          node --input-type=module -e "
            import {readFileSync} from 'node:fs';
            const a=JSON.parse(readFileSync(process.argv[1]));
            if(a.checked!==24 || a.render_ok!==24 || a.review!==0)
              process.exit(1);
          " "$output/diagnostic-summary.json"
      - name: Verify visible claim counts on 24 synthetic guide renders without screenshots
        run: |
          bash -n cloudflare/audit-private-12-visible-claims-on-mac.sh
          node --check cloudflare/private-12-guide-render-local.mjs
          node cloudflare/tests/private-12-visual-synthetic-fixture.mjs --editorial-badge |
            node cloudflare/private-12-guide-render-local.mjs --claims-only > "$RUNNER_TEMP/visible-claim-counts.txt"
          cat "$RUNNER_TEMP/visible-claim-counts.txt" # Synthetic fixtures only; no private D1 data.
          test "$(grep -c '^VISIBLE_CLAIMS ' "$RUNNER_TEMP/visible-claim-counts.txt")" = 12
          grep -qF 'VISIBLE_CLAIMS B1_FR | badge=1 | source_date=1 | other_dates=1 | mobile_match=true' "$RUNNER_TEMP/visible-claim-counts.txt"
          grep -qF 'VISIBLE_CLAIMS B1_NL | badge=1 | source_date=0 | other_dates=1 | mobile_match=true' "$RUNNER_TEMP/visible-claim-counts.txt"
          grep -qF 'VISIBLE_CLAIMS B5_LOST_BE | badge=1 | source_date=1 | other_dates=1 | mobile_match=true' "$RUNNER_TEMP/visible-claim-counts.txt"
      - name: Check sanitized procedural audit diagnostics on an incomplete private input
        run: |
          set +e
          printf '{"results":[{"guide_key":"B1_FR","route":"B1_FIRST_CRDS","script_js":"PRIVATE_SENTINEL_TEST_DO_NOT_PRINT"}]}' |
            node cloudflare/private-12-guide-render-local.mjs --evidence-only > "$RUNNER_TEMP/safe-qa-block.txt" 2>&1
          status=$?
          set -e
          test "$status" = 2
          grep -qF 'PRIVATE VISUAL QA BLOCKED | STAGE_PREFLIGHT_PRIVATE_GUIDES | GUIDE_NONE' "$RUNNER_TEMP/safe-qa-block.txt"
          if grep -qF 'PRIVATE_SENTINEL_TEST_DO_NOT_PRINT' "$RUNNER_TEMP/safe-qa-block.txt"; then
            echo 'Failure diagnostics leaked synthetic fixture; blocking.'
            exit 1
          fi
      - name: Verify 24 isolated procedural risk scans on synthetic customer-facing guides
        run: |
          node cloudflare/tests/private-12-visual-synthetic-fixture.mjs --evidence-examples --editorial-badge |
            node cloudflare/private-12-guide-render-local.mjs --evidence-only > "$RUNNER_TEMP/evidence-synthetic-only.txt"
          cat "$RUNNER_TEMP/evidence-synthetic-only.txt" # synthetic content only
          grep -qF 'PRIVATE PROCEDURE SIGNALS: 24/24 offline' "$RUNNER_TEMP/evidence-synthetic-only.txt"
          test "$(grep -c '^EVIDENCE_REVIEW ' "$RUNNER_TEMP/evidence-synthetic-only.txt")" = 12
          grep -E '^EVIDENCE_REVIEW B1_FR ' "$RUNNER_TEMP/evidence-synthetic-only.txt" | grep -q 'REVIEW_FR_FIRST_CRDS_CARTE_VITALE_IN_CONTEXT'
          grep -E '^EVIDENCE_REVIEW B5_RENEWAL_BE ' "$RUNNER_TEMP/evidence-synthetic-only.txt" | grep -q 'REVIEW_BE_APPLICATION_NOT_APPROVED_STATUS'
          grep -E '^EVIDENCE_REVIEW B1_NL ' "$RUNNER_TEMP/evidence-synthetic-only.txt" | grep -q 'REVIEW_NL_BSN_NOT_ADDRESS_PROOF'
          grep -E '^EVIDENCE_REVIEW B5_LOST_IE ' "$RUNNER_TEMP/evidence-synthetic-only.txt" | grep -q 'REVIEW_IE_PPS_NOT_ADDRESS_PROOF'
          grep -E '^EVIDENCE_REVIEW B1_IE ' "$RUNNER_TEMP/evidence-synthetic-only.txt" | grep -q 'REVIEW_UNAPPROVED_PUBLIC_VERIFICATION_CLAIM'
          grep -E '^EVIDENCE_REVIEW B1_NL ' "$RUNNER_TEMP/evidence-synthetic-only.txt" | grep -q 'REVIEW_UNAPPROVED_PUBLIC_VERIFICATION_CLAIM'
      - name: Test questionnaire navigation in Chromium and WebKit
        run: node cloudflare/tests/browser-smoke.mjs
      - name: Test historical B5 renderer across all ten countries
        run: node cloudflare/tests/b5-legacy-render.browser.mjs
      - name: Verify private D1 review patch using synthetic historical fixture
        run: |
          fixture="$RUNNER_TEMP/actero-b5-test-fixture.json"
          revision="$RUNNER_TEMP/actero-b5-review-draft.json"
          trap 'rm -f "$fixture" "$revision"' EXIT
          node cloudflare/tests/b5-private-fixture.mjs "$fixture"
          node cloudflare/tests/b5-legacy-render.browser.mjs "$fixture"
          node cloudflare/prepare-b5-uk-review.mjs "$fixture" "$revision"
          node cloudflare/verify-b5-review-diff.mjs "$fixture" "$revision"
          node cloudflare/tests/b5-review-draft.test.mjs "$revision"
          node cloudflare/tests/b5-legacy-render.browser.mjs "$revision"
          checklist="$RUNNER_TEMP/actero-b5-checklist-draft.json"
          trap 'rm -f "$fixture" "$revision" "$checklist"' EXIT
          node cloudflare/prepare-b5-checklist-review.mjs "$revision" "$checklist"
          node cloudflare/verify-b5-checklist-diff.mjs "$revision" "$checklist"
          node cloudflare/tests/b5-legacy-render.browser.mjs "$checklist"
          node cloudflare/b5-mobile-visual-local.mjs "$checklist" "$RUNNER_TEMP/b5-visual-synthetic"
          country_review="$RUNNER_TEMP/actero-b5-country-review-draft.json"
          node cloudflare/prepare-b5-country-review-local.mjs "$checklist" "$country_review"
          node cloudflare/tests/b5-legacy-render.browser.mjs "$country_review"
          node cloudflare/b5-mobile-visual-local.mjs "$country_review" "$RUNNER_TEMP/b5-country-visual-synthetic" FR,BE,NL,IE
      - name: Upload browser screenshots when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: actero-browser-qa-failures
          path: browser-qa-screenshots/
          if-no-files-found: ignore
